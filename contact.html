<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Contact | Endalkachew Abebe Kebede</title>

  <meta
    name="description"
    content="Contact Endalkachew Abebe Kebede and view his professional profiles on Google Scholar, LinkedIn, and ORCID."
  />

  <link rel="stylesheet" href="assets/style.css" />

  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <style>
    .contact-card {
      text-align: center;
      padding: 40px 30px;
    }

    .contact-name {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .contact-description {
      margin: 0 0 28px;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      color: #666;
      font-size: 48px;
      text-decoration: none;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .social-link:hover,
    .social-link:focus {
      color: #222;
      transform: translateY(-3px);
    }

    .social-link:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 5px;
      border-radius: 8px;
    }

    .orcid-icon {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      border: 4px solid currentColor;
      border-radius: 50%;
      width: 47px;
      height: 47px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -1px;
    }

    @media (max-width: 600px) {
      .contact-card {
        padding: 30px 18px;
      }

      .social-links {
        gap: 18px;
      }

      .social-link {
        width: 58px;
        height: 58px;
        font-size: 40px;
      }

      .orcid-icon {
        width: 40px;
        height: 40px;
        font-size: 21px;
        border-width: 3px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <div class="brand">
      <div class="name">Endalkachew Abebe Kebede</div>
      <div class="tag">Water–Food–Energy Nexus</div>
    </div>

    <nav class="nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="teaching.html">Teaching</a>
      <a href="publications.html">
        Publications &amp; Presentations
      </a>
      <a href="datasets.html">Datasets</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>

  </div>
</header>

<main class="main">
  <div class="container">

    <h1 class="page-title">Contact</h1>

    <div class="card contact-card">

      <h2 class="contact-name">
        Endalkachew Abebe Kebede
      </h2>

      <p class="lede contact-description">
        Please feel free to contact me by email or connect with me through
        one of the professional profiles below.
      </p>

      <div class="social-links">

        <!-- Email -->
        <a
          class="social-link"
          href="mailto:endiabe@udel.edu"
          aria-label="Email Endalkachew Abebe Kebede"
          title="Email"
        >
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
        </a>

        <!-- Google Scholar -->
        <a
          class="social-link"
          href="https://scholar.google.com/citations?user=QZiKixgAAAAJ&amp;hl=en"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Google Scholar profile"
          title="Google Scholar"
        >
          <i class="fa-brands fa-google-scholar" aria-hidden="true"></i>
        </a>

        <!-- LinkedIn -->
        <a
          class="social-link"
          href="https://linkedin.com/in/endalkachew-a-kebede-46086293"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn profile"
          title="LinkedIn"
        >
          <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
        </a>

        <!-- ORCID -->
        <a
          class="social-link"
          href="https://orcid.org/0000-0002-5212-7340"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="ORCID profile"
          title="ORCID"
        >
          <span class="orcid-icon" aria-hidden="true">iD</span>
        </a>

      </div>

    </div>

  </div>
</main>

<footer class="footer">
  <div class="container">
    © 2026 Endalkachew Abebe Kebede
  </div>
</footer>

</body>
</html>
